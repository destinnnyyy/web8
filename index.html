<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Обратная связь</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&amp;family=Unbounded:wght@700&amp;display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <h1 class="page__title">Обратная связь</h1>
        <p class="page__lead">Есть вопрос или предложение? Нажмите кнопку и напишите нам.</p>
        <p>
            <button type="button" class="cta" id="open-button">Написать нам</button>
        </p>
    </main>
    <footer class="page__footer">
        <p>&copy; Щадей Артём, МО21</p>
    </footer>

    <dialog class="popup" id="popup" aria-labelledby="popup-title">
        <form class="form" id="feedback-form" method="post">
            <div class="form__head">
                <h2 class="form__title" id="popup-title">Написать нам</h2>
                <button type="button" class="close" id="close-button" aria-label="Закрыть форму">
                    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                        <path d="M3 3l12 12M15 3L3 15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <p class="status" id="form-status" role="status" data-kind="hint">Поле «Организация» можно пропустить.</p>

            <label class="field">
                <span>ФИО</span>
                <input type="text" name="fullName" autocomplete="name" required maxlength="120"
                    pattern="[\p{L}\s\-]+" title="Только буквы, пробелы и дефис">
            </label>
            <label class="field">
                <span>Email</span>
                <input type="email" name="email" autocomplete="email" required maxlength="120">
            </label>
            <label class="field">
                <span>Телефон</span>
                <input type="tel" name="phone" autocomplete="tel" inputmode="tel" required
                    pattern="\+?[0-9\s\-]{6,20}" title="Например: +7 999 123-45-67" maxlength="20">
            </label>
            <label class="field">
                <span>Организация</span>
                <input type="text" name="organization" autocomplete="organization" maxlength="120">
            </label>
            <label class="field field--grow">
                <span>Сообщение</span>
                <textarea name="message" rows="3" required maxlength="1000"></textarea>
            </label>

            <label class="consent">
                <input type="checkbox" name="consent" required>
                <span>Согласен с политикой обработки персональных данных</span>
            </label>

            <button type="submit" class="submit" id="submit-button">Отправить</button>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
